name: mc-tas-lang
version: '${project.version}'
main: tas.mcTASLang
api-version: '26.2'
depend: [m7]

commands:
  spawnfakes:
    description: Spawn the fake players and give them their kits
    usage: /spawnfakes
  kickallfakes:
    description: Kick all fake players
    usage: /kickallfakes
  spectate:
    description: Spectate a class
    usage: /spectate <class>
  unspectate:
    description: Stop spectating a class
    usage: /unspectate
  tas:
    description: Begin TAS
    usage: /tas <section>
  simulate:
    description: Simulates player actions
    usage: /simulate <move|click|hotbar|turnhead|allblessings|undo>
