name: mc-tas-lang
version: '${project.version}'
main: plugin.mcTASLang
api-version: '26.2'

commands:
  spawnfakes:
    description: Spawn the fake players
    usage: /spawnfakes
  # Also M7's label; the bare form is claimed in onEnable (claimSetupLabel), M7's stays /m7:setup.
  setup:
    description: Reset the dungeon (/m7:setup) and spawn the fake players
    usage: /setup
  kickallfakes:
    description: Kick all fake players
    usage: /kickallfakes
  spectate:
    description: Spectate a class
    usage: /spectate <class>
  unspectate:
    description: Stop spectating a class
    usage: /unspectate
  tas:
    description: Begin TAS
    usage: /tas <section>
  simulate:
    description: Simulates player actions
    usage: /simulate <move|click|hotbar|turnhead|swapitems|command|gui|closegui|undo>
